baseURL = "https://jcash.github.io/jctest/"
defaultContentLanguage = "en"
title = "jctest"
publishDir = "../docs"
enableGitInfo = true
enableRobotsTXT = true
ignoreFiles = ['data/docset-index\.txt$']

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

  [module.hugoVersion]
    extended = true
    min = "0.146.0"

[imaging]
  quality = 99

[services.googleAnalytics]
  id = "UA-152712676-1"

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[menu]
  [[menu.main]]
    name = "Documentation"
    pageRef = "/main"
    weight = 1
  [[menu.main]]
    name = "API"
    pageRef = "/api"
    weight = 2
  [[menu.main]]
    name = "Benchmarks"
    pageRef = "/benchmarks"
    weight = 3
  [[menu.main]]
    name = "Search"
    weight = 4
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/JCash/jctest"
    weight = 5
    [menu.main.params]
      icon = "github"

[params]
  description = "Small but powerful C11 and C++11 unit test frameworks"
  externalLinkDecoration = true
  displayUpdatedDate = true
  dateFormat = "January 2, 2006"

  [params.navbar]
    displayTitle = true
    displayLogo = true
    width = "wide"

    [params.navbar.logo]
      path = "images/logo.svg"
      width = 32
      height = 32

  [params.theme]
    default = "system"
    displayToggle = true

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = true
    width = "wide"

  [params.search]
    enable = true
    type = "flexsearch"

    [params.search.flexsearch]
      index = "content"
      tokenize = "forward"
      js = "js/vendor/flexsearch.bundle.min.js"

  [params.editURL]
    enable = true
    base = "https://github.com/JCash/jctest/edit/master/hugo/content"

  [params.toc]
    displayTags = false

  [params.highlight.copy]
    enable = true
    display = "hover"

  [params.page]
    width = "wide"
    displayPagination = true
